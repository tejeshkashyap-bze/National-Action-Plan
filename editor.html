<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BZE Assessment Editor</title>
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet" />
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <style>
    :root {
      --bg: #eef6fb;
      --card: #ffffff;
      --border: #cfdce6;
      --header: #1f6fa7;
      --text: #0f2a3a;
      --muted: #5a7486;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 20px 56px;
    }

    h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 28px;
      line-height: 1.5;
    }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--header);
      margin: 0 0 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ── Form rows ── */
    .row {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      margin-bottom: 14px;
    }

    .row:last-child { margin-bottom: 0; }

    .field { display: flex; flex-direction: column; gap: 5px; }

    label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    select, input[type="text"] {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 11px;
      font: inherit;
      font-size: 13px;
      color: var(--text);
      background: #fff;
      width: 100%;
    }

    select:focus, input[type="text"]:focus {
      outline: 2px solid var(--header);
      outline-offset: 1px;
      border-color: transparent;
    }

    .date-pair { display: flex; gap: 8px; }
    .date-pair select { flex: 1; }

    /* ── Score selector ── */
    .score-row {
      display: flex;
      gap: 8px;
    }

    .score-btn {
      flex: 1;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      background: #f7fbff;
      color: var(--text);
      transition: transform 80ms;
    }

    .score-btn:hover { filter: brightness(0.95); }
    .score-btn:active { transform: scale(0.97); }

    .score-btn.active-1 { background: #7b0000; border-color: #5a0000; color: #fff; }
    .score-btn.active-2 { background: #c0392b; border-color: #96281b; color: #fff; }
    .score-btn.active-3 { background: #1a56a8; border-color: #13407e; color: #fff; }
    .score-btn.active-4 { background: #a8d5a2; border-color: #7ab872; color: #1a3a1a; }
    .score-btn.active-5 { background: #1e7e34; border-color: #155724; color: #fff; }

    /* ── Grading scale ── */
    .scale-grid { display: flex; flex-direction: column; gap: 8px; }

    .scale-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .scale-badge {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .b1 { background: #7b0000; color: #fff; }
    .b2 { background: #c0392b; color: #fff; }
    .b3 { background: #1a56a8; color: #fff; }
    .b4 { background: #a8d5a2; color: #1a3a1a; }
    .b5 { background: #1e7e34; color: #fff; }

    .scale-row input { flex: 1; }

    /* ── Paragraphs ── */
    .para-list { display: flex; flex-direction: column; gap: 12px; }

    .para-block {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .para-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 12px;
      background: #f6fbff;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .para-remove {
      background: none;
      border: none;
      color: #c0392b;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 0 2px;
    }

    .para-remove:hover { color: #7b0000; }

    .ql-container { font-size: 13px; }
    .ql-editor { min-height: 72px; }
    .ql-toolbar { border-color: var(--border) !important; }
    .ql-container { border-color: var(--border) !important; }

    .add-para-btn {
      margin-top: 10px;
      width: 100%;
      background: none;
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 8px 16px;
      font: inherit;
      font-size: 13px;
      color: var(--header);
      cursor: pointer;
    }

    .add-para-btn:hover { background: #f0f8ff; border-color: var(--header); }

    /* ── Generate button ── */
    .generate-btn {
      width: 100%;
      background: var(--header);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px 28px;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .generate-btn:hover { background: #155d8f; }

    /* ── Output ── */
    .output-section { display: none; }
    .output-section.visible { display: block; }

    .output-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    }

    .output-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .output-fname {
      font-family: monospace;
      font-size: 14px;
      font-weight: 700;
      color: var(--header);
    }

    .copy-btn {
      background: #e8f4fd;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 14px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      color: var(--header);
      cursor: pointer;
    }

    .copy-btn:hover { background: #d0eafb; }
    .copy-btn.ok { background: #d4edda; color: #155724; border-color: #c3e6cb; }

    .output-note {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 10px;
    }

    .output-code {
      background: #f6fbff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      max-height: 380px;
      overflow-y: auto;
    }

    .error-msg {
      background: #fdf0f0;
      border: 1px solid #f5c6cb;
      color: #721c24;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }

    .error-msg.visible { display: block; }
  </style>
</head>
<body>
<div class="container">

  <h1>BZE Assessment Editor</h1>
  <p class="subtitle">Fill in the fields below for a single criterion assessment, then click <strong>Generate Snippets</strong>.<br>
  Copy each snippet and paste it into the indicated location in the relevant data file.</p>

  <!-- ── 1. Details ───────────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-title">Assessment Details</div>
    <div class="row">
      <div class="field">
        <label for="citySelect">City</label>
        <select id="citySelect"></select>
      </div>
      <div class="field">
        <label for="indicatorSelect">Indicator</label>
        <select id="indicatorSelect"></select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Assessment Date</label>
        <div class="date-pair">
          <select id="monthSelect"></select>
          <select id="yearSelect"></select>
        </div>
      </div>
      <div class="field">
        <label>Score</label>
        <div class="score-row" id="scoreRow">
          <button class="score-btn" data-score="1" onclick="setScore(1)">1</button>
          <button class="score-btn" data-score="2" onclick="setScore(2)">2</button>
          <button class="score-btn" data-score="3" onclick="setScore(3)">3</button>
          <button class="score-btn" data-score="4" onclick="setScore(4)">4</button>
          <button class="score-btn" data-score="5" onclick="setScore(5)">5</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── 2. Grading Scale ──────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-title">Indicator Grading Scale</div>
    <div class="scale-grid" id="scaleGrid"></div>
  </div>

  <!-- ── 3. Paragraphs ────────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-title">Assessment Paragraphs</div>
    <div class="para-list" id="paraList"></div>
    <button class="add-para-btn" onclick="addParagraph()">+ Add paragraph</button>
  </div>

  <!-- ── Generate ─────────────────────────────────────────────────────── -->
  <div class="error-msg" id="errorMsg"></div>
  <button class="generate-btn" onclick="generate()">Generate Snippets</button>

  <!-- ── Output ───────────────────────────────────────────────────────── -->
  <div class="output-section" id="outputSection">

    <div class="output-card">
      <div class="output-top">
        <span class="output-fname" id="evidenceFname">evidence-kwinana.js</span>
        <button class="copy-btn" id="copyEvidenceBtn" onclick="copyCode('evidenceCode','copyEvidenceBtn')">Copy</button>
      </div>
      <p class="output-note" id="evidenceNote"></p>
      <div class="output-code" id="evidenceCode"></div>
    </div>

    <div class="output-card">
      <div class="output-top">
        <span class="output-fname">scores.js</span>
        <button class="copy-btn" id="copyScoresBtn" onclick="copyCode('scoresCode','copyScoresBtn')">Copy</button>
      </div>
      <p class="output-note" id="scoresNote"></p>
      <div class="output-code" id="scoresCode"></div>
    </div>

  </div>
</div><!-- /container -->

<script src="data.js"></script>
<script>

// ── City labels ────────────────────────────────────────────────────────────

const CITY_LABELS = {
  "karratha":       "Karratha",
  "port-hedland":   "Port Hedland",
  "darwin":         "Darwin",
  "geraldton":      "Geraldton",
  "kwinana":        "Kwinana",
  "collie":         "Collie",
  "whyalla":        "Whyalla",
  "mt-isa":         "Mt Isa",
  "townsville":     "Townsville",
  "gladstone":      "Gladstone",
  "hunter-valley":  "Hunter Valley",
  "port-kembla":    "Illawarra",
  "geelong":        "Geelong",
  "latrobe-valley": "Latrobe Valley",
  "portland":       "Portland",
  "bell-bay":       "Bell Bay",
};

const MONTHS = [
  "January","February","March","April","May","June",
  "July","August","September","October","November","December",
];

// ── Grading scale defaults ─────────────────────────────────────────────────

const SUPPORT = [
  "Minimal support (Severe Deficiency).",
  "Basic support (Moderate Deficiency).",
  "Moderate support (Developing).",
  "Strong support (Effective).",
  "Exemplary support (Leading Practice).",
];

const COMMITMENT = [
  "Minimal commitment (Severe Deficiency).",
  "Basic commitment (Moderate Deficiency).",
  "Moderate commitment (Developing).",
  "Strong commitment (Effective).",
  "Exemplary commitment (Leading Practice).",
];

const GRADING_SCALES = {
  "renewable-energy-generation": [
    "Poor progress towards 2035 requirements. Less than 25% of required capacity is in development, with 15% or less approved and 10% or less in construction or operating.",
    "Improving progress towards 2035 requirements. Between 25% and 50% of required capacity is in development, with 15–40% approved and 10–25% in construction or operating.",
    "Moderate progress towards 2035 requirements. Between 50% and 75% of required capacity is in development, with 40–60% approved and 25–40% in construction or operating.",
    "Strong progress towards 2035 requirements. Between 75% and 100% of required capacity is in development, with 60–85% approved and 40–50% in construction or operating.",
    "Exemplary progress towards 2035 requirements. More than 100% of required capacity is in development, with over 85% approved and over 50% in construction or operating.",
  ],
  "transmission-network": [
    "Minimal planning. Transmission tracking to meet approximately 25–50% of industrial demand.",
    "Basic planning. Transmission tracking to meet more than 50% of industrial demand.",
    "Moderate planning. Transmission tracking to meet electrification of existing industry and up to 20% additional demand.",
    "Strong planning. Transmission on track for 100% electrification of existing industry and 20–50% additional demand for new green industries.",
    "Exemplary planning. Transmission on track for 100% of needs of existing and new entrant industries.",
  ],
  "distribution-network": [
    "No electrification plans, including at the household level.",
    "Limited electrification planning. Planning for modest consumer energy resource (CER) uptake, but no industry electrification.",
    "Moderate electrification planning. Planning for high CER uptake, but no industry electrification.",
    "Strong electrification planning. Planning for 100% CER and modest industry electrification.",
    "Exemplary electrification planning. Planning for 100% CER, high industry electrification and capacity for new entrants.",
  ],
  "energy-storage": [
    "Poor progress towards 2035 storage requirements. Less than 25% of required capacity/depth is in development, with 15% or less approved and 10% or less in construction or operating.",
    "Improving progress towards 2035 storage requirements. Between 25% and 50% of required capacity/depth is in development, with 15–40% approved and 10–25% in construction or operating.",
    "Moderate progress towards 2035 storage requirements. Between 50% and 75% of required capacity/depth is in development, with 40–60% approved and 25–40% in construction or operating.",
    "Strong progress towards 2035 storage requirements. Between 75% and 100% of required capacity/depth is in development, with 60–85% approved and 40–50% in construction or operating.",
    "Exemplary progress towards 2035 storage requirements. Over 100% of required capacity/depth is in development, with more than 85% approved and more than 50% in construction or operating.",
  ],
  "hydrogen-network": [
    "Underinvestment. Projects likely to deliver only a small amount of green hydrogen by 2035.",
    "Underinvestment. Projects likely to deliver a modest amount of green hydrogen by 2035.",
    "Investment in place for a high amount of green hydrogen by 2035.",
    "Projects expected to come online 2030–35, meeting approximately 50% of Green Energy Exports requirements.",
    "Projects expected to come online 2030–35, meeting 100% of Green Energy Exports requirements.",
  ],
  "housing": [
    "Critical gap. Severe shortfall of workforce accommodation with no funded delivery mechanism.",
    "Material gap. Significant shortfall of accommodation capacity relative to project pipeline demand, with no binding legacy commitment or coordinated strategy.",
    "Developing. Some accommodation strategy in place but shortfalls remain and legacy conversion commitments are limited.",
    "Strong. Accommodation supply broadly matching pipeline demand, with funded legacy conversion commitments.",
    "Exemplary. Purpose-built accommodation fully meeting demand, with binding legacy conversion and community housing outcomes secured.",
  ],
  "industry-decarbonisation-plans": [
    "Most companies have plans with no targets and/or not funded (Limited Plan/Insufficient Targets).",
    "Most companies have plans with targets, but only some are aligned to 75% emissions reduction by 2035 and not all commitments are funded (Basic Plans/Uncertain Implementation Pathways).",
    "Most companies have plans with targets, and most are aligned to 75% emissions reduction by 2035 and are funded (Intermediate Plans/Developing Momentum).",
    "All major companies have plans with targets aligned with 75% emissions reduction by 2035, with commitments funded but no internal performance initiatives (Comprehensive Plans/Aligned with Regional Goals).",
    "All major companies have plans aligned with 75% emissions reduction by 2035, are fully funded and have internal performance initiatives (Leading Practice/Exemplary Industry Leadership).",
  ],
  "federal-emissions-commitment": COMMITMENT,
  "federal-skills-training":       SUPPORT,
  "federal-approvals":              SUPPORT,
  "federal-investment-framework":   SUPPORT,
  "federal-rd":                     SUPPORT,
  "federal-procurement":            SUPPORT,
  "state-emissions-commitment":     COMMITMENT,
  "state-skills-training":          SUPPORT,
  "state-approvals":                SUPPORT,
  "state-investment-framework":     SUPPORT,
  "state-rd":                       SUPPORT,
  "state-procurement":              SUPPORT,
  "lga-decarbonisation-plans": [
    "Minimal Plan (Severe Deficiency).",
    "Basic Plan (Moderate Deficiency).",
    "Moderate Plan (Developing).",
    "Strong Plan (Effective).",
    "Exemplary Plan (Leading Practice).",
  ],
  "strategic-nature-positive-planning": [
    "Minimal level of planning (Severe Deficiency).",
    "Basic level of planning (Moderate Deficiency).",
    "Moderate level of planning (Developing).",
    "Strong level of planning (Effective).",
    "Exemplary level of planning (Leading Practice).",
  ],
  "wider-community-benefit-sharing": [
    "Minimal level of community benefits (Severe Deficiency).",
    "Basic level of community benefits (Moderate Deficiency).",
    "Moderate level of community benefits (Developing).",
    "Strong level of community benefits (Effective).",
    "Exemplary level of community benefits (Leading Practice).",
  ],
  "effective-community-engagement": [
    "Minimal level of communication and engagement (Severe Deficiency).",
    "Basic level of communication and engagement (Moderate Deficiency).",
    "Moderate level of communication and engagement (Developing).",
    "Strong level of communication and engagement (Effective).",
    "Exemplary level of communication and engagement (Leading Practice).",
  ],
};

// ── State ──────────────────────────────────────────────────────────────────

let selectedScore = null;
let paraSeq = 0;
let quilts = []; // { id, quill }

// ── Boot ───────────────────────────────────────────────────────────────────

function init() {
  // Cities
  const cityEl = document.getElementById("citySelect");
  for (const [key, label] of Object.entries(CITY_LABELS)) {
    const o = document.createElement("option");
    o.value = key; o.textContent = label;
    cityEl.appendChild(o);
  }

  // Indicators (grouped by pillar → group)
  const indEl = document.getElementById("indicatorSelect");
  for (const pillar of CSC) {
    for (const group of pillar.groups) {
      const og = document.createElement("optgroup");
      og.label = `${pillar.pillarTitle} › ${group.groupTitle}`;
      for (const item of group.items) {
        const o = document.createElement("option");
        o.value = item.id; o.textContent = item.title;
        og.appendChild(o);
      }
      indEl.appendChild(og);
    }
  }
  indEl.addEventListener("change", refreshScale);

  // Months
  const monthEl = document.getElementById("monthSelect");
  MONTHS.forEach((m, i) => {
    const o = document.createElement("option");
    o.value = m; o.textContent = m;
    if (i === new Date().getMonth()) o.selected = true;
    monthEl.appendChild(o);
  });

  // Years (current + 5)
  const yearEl = document.getElementById("yearSelect");
  const thisYear = new Date().getFullYear();
  for (let y = thisYear; y <= thisYear + 5; y++) {
    const o = document.createElement("option");
    o.value = y; o.textContent = y;
    yearEl.appendChild(o);
  }

  refreshScale();
  addParagraph();
}

// ── Score buttons ──────────────────────────────────────────────────────────

function setScore(n) {
  selectedScore = n;
  document.querySelectorAll(".score-btn").forEach(btn => {
    const s = +btn.dataset.score;
    btn.className = "score-btn" + (s === n ? ` active-${s}` : "");
  });
}

// ── Grading scale ──────────────────────────────────────────────────────────

function refreshScale() {
  const id = document.getElementById("indicatorSelect").value;
  const defaults = GRADING_SCALES[id] || ["", "", "", "", ""];
  const grid = document.getElementById("scaleGrid");
  grid.innerHTML = "";
  for (let i = 1; i <= 5; i++) {
    const row = document.createElement("div");
    row.className = "scale-row";
    row.innerHTML = `
      <div class="scale-badge b${i}">${i}</div>
      <input type="text" id="scale${i}" value="${escHtml(defaults[i - 1] || "")}"
             placeholder="Description for score ${i}" />
    `;
    grid.appendChild(row);
  }
}

// ── Paragraphs ─────────────────────────────────────────────────────────────

function addParagraph() {
  const qid = `q${++paraSeq}`;
  const list = document.getElementById("paraList");
  const num  = list.children.length + 1;

  const block = document.createElement("div");
  block.className = "para-block";
  block.dataset.qid = qid;
  block.innerHTML = `
    <div class="para-head">
      <span>Paragraph ${num}</span>
      <button class="para-remove" title="Remove paragraph" onclick="removeParagraph(this)">×</button>
    </div>
    <div id="${qid}"></div>
  `;
  list.appendChild(block);

  const q = new Quill(`#${qid}`, {
    theme: "snow",
    modules: {
      toolbar: [
        ["bold", "italic"],
        [{ list: "ordered" }, { list: "bullet" }],
        ["link"],
        ["clean"],
      ],
    },
  });
  quilts.push({ id: qid, quill: q });
  renumber();
}

function removeParagraph(btn) {
  const block = btn.closest(".para-block");
  quilts = quilts.filter(q => q.id !== block.dataset.qid);
  block.remove();
  renumber();
}

function renumber() {
  document.querySelectorAll(".para-block").forEach((b, i) => {
    b.querySelector(".para-head span").textContent = `Paragraph ${i + 1}`;
  });
}

// ── Generate ───────────────────────────────────────────────────────────────

function generate() {
  hideError();

  const cityKey   = document.getElementById("citySelect").value;
  const indId     = document.getElementById("indicatorSelect").value;
  const month     = document.getElementById("monthSelect").value;
  const year      = document.getElementById("yearSelect").value;
  const date      = `${month} ${year}`;

  if (!selectedScore) { showError("Please select a score (1–5)."); return; }

  // Build grading scale HTML (raw — jsLit will escape it for JS output)
  const scaleItems = [];
  for (let i = 1; i <= 5; i++) {
    const txt = document.getElementById(`scale${i}`).value.trim();
    scaleItems.push(`<li><strong>${i}</strong> – ${txt}</li>`);
  }
  const scaleHtml =
    `<strong>Indicator grading scale</strong>` +
    `<ul class="bulletList" style="margin-top:6px">${scaleItems.join("")}</ul>`;

  // Collect Quill paragraphs (skip empty)
  const paras = [scaleHtml];
  for (const { quill } of quilts) {
    const raw = quill.root.innerHTML.trim();
    if (!raw || raw === "<p><br></p>") continue;
    paras.push(normaliseQuillHtml(raw));
  }

  if (paras.length < 2) {
    showError("Please add at least one assessment paragraph.");
    return;
  }

  // ── Snippet 1: evidence file ──
  const parasJs = paras.map(p => `        ${jsLit(p)},`).join("\n");
  const evidenceSnippet =
`{
  date: ${jsLit(date)},
  score: ${selectedScore},
  paragraphs: [
${parasJs}
  ]
},`;

  const evidenceFile = `evidence-${cityKey}.js`;

  document.getElementById("evidenceFname").textContent = evidenceFile;
  document.getElementById("evidenceNote").textContent =
    `In ${evidenceFile}, find CITY_EVIDENCE["${indId}"] and prepend this object at the top of the array. ` +
    `If that key doesn't exist yet, create it: "${indId}": [ <paste here> ],`;
  document.getElementById("evidenceCode").textContent = evidenceSnippet;

  // ── Snippet 2: scores file ──
  const scoresSnippet = `"${indId}": ${selectedScore},`;

  document.getElementById("scoresNote").textContent =
    `In scores.js, find the "${cityKey}" city. ` +
    `If a "${date}" round already exists, add this line inside its scores: { … } object. ` +
    `If "${date}" is a new round, prepend a new { date: "${date}", scores: { … } } object to the array and include this line inside it.`;
  document.getElementById("scoresCode").textContent = scoresSnippet;

  const out = document.getElementById("outputSection");
  out.classList.add("visible");
  out.scrollIntoView({ behavior: "smooth" });
}

// ── Helpers ────────────────────────────────────────────────────────────────

// Serialise a raw string as a JS double-quoted string literal.
function jsLit(str) {
  return '"' + str
    .replace(/\\/g, "\\\\")
    .replace(/"/g, '\\"')
    .replace(/\r?\n/g, "\\n")
  + '"';
}

// If a Quill block is a single plain <p>…</p>, unwrap it so previous.html
// applies its sectionText class. Lists and multi-block HTML stay as-is.
function normaliseQuillHtml(html) {
  const trimmed = html.trim();
  // Single <p> with no nested block elements
  if (trimmed.startsWith("<p>") && trimmed.endsWith("</p>")) {
    const inner = trimmed.slice(3, -4);
    // Only unwrap if there are no other block-level tags inside
    if (!/<(p|ul|ol|li|blockquote|div|h[1-6])[>\s]/i.test(inner)) {
      return inner;
    }
  }
  return trimmed;
}

// Escape characters that would break an HTML attribute value
function escHtml(str) {
  return str.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

function showError(msg) {
  const el = document.getElementById("errorMsg");
  el.textContent = msg;
  el.classList.add("visible");
  el.scrollIntoView({ behavior: "smooth" });
}

function hideError() {
  document.getElementById("errorMsg").classList.remove("visible");
}

function copyCode(codeId, btnId) {
  const text = document.getElementById(codeId).textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById(btnId);
    const orig = btn.textContent;
    btn.textContent = "Copied!";
    btn.classList.add("ok");
    setTimeout(() => { btn.textContent = orig; btn.classList.remove("ok"); }, 2000);
  });
}

// ── Start ──────────────────────────────────────────────────────────────────
init();

</script>
