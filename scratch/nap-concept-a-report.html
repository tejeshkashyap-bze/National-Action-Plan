<!doctype html>
<!-- concept: Conservative, on-brand editorial direction. Treats the NAP as a published
     assessment: BZE blue and white, calm type scale, persistent header and breadcrumbs,
     criteria as a progressive-disclosure index rather than a 52-link wall. Scores shown
     on a single-hue sequential ramp so nothing reads as an alarm. -->
<!-- replaces: index.html, CSC.html, city.html, criterion.html -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Concept A — Report · BZE National Action Plan</title>
<style>
:root{
  --blue:#127cbf; --blue-deep:#0d5a8c; --blue-light:#3e9cd3;
  --page:#ffffff; --wash:#f3f8fc; --card:#ffffff;
  --line:#dbe6ee; --line-soft:#eaf1f6;
  --ink:#10222e; --ink-2:#4a5f6d; --ink-3:#7d8f9a;
  --s1:#86b6ef; --s2:#5598e7; --s3:#2a78d6; --s4:#1c5cab; --s5:#0d366b;
  --none:#eef2f5;
  --r:10px; --rl:16px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans); color:var(--ink); background:var(--page);
     font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit; cursor:pointer}
.wrap{max-width:1080px; margin:0 auto; padding:0 28px}

/* ---------- header ---------- */
.site{position:sticky; top:0; z-index:20; background:rgba(255,255,255,.94);
      backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.siteIn{max-width:1080px; margin:0 auto; padding:0 28px; height:62px;
        display:flex; align-items:center; gap:28px}
.mark{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:-.01em;
      font-size:15px; text-decoration:none; white-space:nowrap}
.markDot{width:24px; height:24px; border-radius:50%;
         background:linear-gradient(135deg,var(--blue-light),var(--blue)); flex:none}
.markSub{color:var(--ink-3); font-weight:500}
.nav{margin-left:auto; display:flex; gap:2px}
.nav button{background:none; border:0; padding:8px 12px; border-radius:8px;
            color:var(--ink-2); font-size:14px; font-weight:550}
.nav button:hover{background:var(--wash); color:var(--ink)}
.nav button[aria-current="true"]{color:var(--blue-deep); background:var(--wash); font-weight:650}

/* ---------- crumbs ---------- */
.crumbs{display:flex; gap:8px; align-items:center; font-size:13px; color:var(--ink-3);
        padding:20px 0 0}
.crumbs button{background:none; border:0; padding:0; color:var(--ink-3); text-decoration:underline;
               text-decoration-color:var(--line); text-underline-offset:3px; font-size:13px}
.crumbs button:hover{color:var(--blue-deep)}
.crumbs span{color:var(--line)}

/* ---------- hero ---------- */
.hero{padding:56px 0 40px; border-bottom:1px solid var(--line-soft)}
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
         color:var(--blue); margin-bottom:14px}
h1{font-size:clamp(30px,4.4vw,46px); line-height:1.1; letter-spacing:-.022em;
   margin:0 0 18px; max-width:20ch; font-weight:700}
.lede{font-size:18px; line-height:1.55; color:var(--ink-2); max-width:62ch; margin:0}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
       gap:0; margin-top:40px; border-top:1px solid var(--line-soft)}
.tile{padding:20px 22px 20px 0}
.tileN{font-size:34px; font-weight:700; letter-spacing:-.03em; line-height:1;
       color:var(--blue-deep)}
.tileL{font-size:13px; color:var(--ink-3); margin-top:8px; line-height:1.4}

/* ---------- sections ---------- */
section{padding:48px 0}
.secHead{display:flex; align-items:flex-end; justify-content:space-between; gap:20px;
         margin-bottom:22px}
h2{font-size:22px; letter-spacing:-.015em; margin:0; font-weight:700}
.secNote{font-size:13px; color:var(--ink-3); max-width:44ch; text-align:right}

/* ---------- region cards ---------- */
.regions{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px}
.rCard{text-align:left; background:var(--card); border:1px solid var(--line);
       border-radius:var(--r); padding:16px 16px 14px; display:flex; flex-direction:column;
       gap:12px; transition:border-color .14s, box-shadow .14s, transform .14s}
.rCard:hover{border-color:var(--blue-light); box-shadow:0 6px 18px rgba(16,34,46,.07);
             transform:translateY(-1px)}
.rCard[data-status="none"]{background:#fbfcfd}
.rCard[data-status="none"]:hover{transform:none; box-shadow:none; border-color:var(--line)}
.rTop{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.rName{font-size:16px; font-weight:650; letter-spacing:-.01em}
.rState{font-size:11px; font-weight:700; color:var(--ink-3); letter-spacing:.06em}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600;
      padding:3px 9px; border-radius:999px; border:1px solid transparent; width:max-content}
.chip[data-s="published"]{background:#eaf4fb; color:var(--blue-deep); border-color:#cee5f4}
.chip[data-s="underway"]{background:#fdf6e8; color:#8a6410; border-color:#f2e2bd}
.chip[data-s="none"]{background:#f4f6f8; color:var(--ink-3); border-color:#e6ebee}
.dots{display:flex; gap:3px}
.dot{width:100%; height:6px; border-radius:2px; background:var(--none)}
.rMeta{font-size:12px; color:var(--ink-3)}

/* ---------- criteria index ---------- */
.pillar{border-top:1px solid var(--line); }
.pillar:last-child{border-bottom:1px solid var(--line)}
.pBtn{width:100%; background:none; border:0; padding:18px 4px; display:flex; gap:16px;
      align-items:center; text-align:left}
.pBtn:hover{background:var(--wash)}
.pIdx{font-size:12px; font-weight:700; color:var(--blue); width:22px; flex:none;
      font-variant-numeric:tabular-nums}
.pName{font-size:17px; font-weight:650; letter-spacing:-.012em}
.pCount{margin-left:auto; font-size:12.5px; color:var(--ink-3); white-space:nowrap}
.pCar{width:10px; height:10px; border-right:1.8px solid var(--ink-3);
      border-bottom:1.8px solid var(--ink-3); transform:rotate(45deg); flex:none;
      transition:transform .16s; margin-left:14px; margin-bottom:3px}
.pBtn[aria-expanded="true"] .pCar{transform:rotate(-135deg); margin-bottom:-3px}
.pBody{padding:0 4px 22px 42px; display:none}
.pBody.open{display:block}
.grp{margin-bottom:20px}
.grpName{font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
         color:var(--ink-3); padding-bottom:8px; border-bottom:1px solid var(--line-soft);
         margin-bottom:2px}
.iRow{width:100%; background:none; border:0; border-bottom:1px solid var(--line-soft);
      padding:11px 4px; display:flex; align-items:center; gap:14px; text-align:left}
.iRow:hover{background:var(--wash)}
.iRow:hover .iName{color:var(--blue-deep)}
.iName{font-size:14.5px; line-height:1.35}
.iScore{margin-left:auto; display:flex; align-items:center; gap:10px; flex:none}
.sBox{width:26px; height:26px; border-radius:6px; display:grid; place-items:center;
      font-size:13px; font-weight:700; color:#fff; font-variant-numeric:tabular-nums}
.sBox[data-v="1"]{background:var(--s1); color:#0d2a4a}
.sBox[data-v="2"]{background:var(--s2)}
.sBox[data-v="3"]{background:var(--s3)}
.sBox[data-v="4"]{background:var(--s4)}
.sBox[data-v="5"]{background:var(--s5)}
.sBox[data-v="-"]{background:var(--none); color:var(--ink-3); font-weight:600}
.sWord{font-size:12px; color:var(--ink-3); width:132px; text-align:right}

/* ---------- legend ---------- */
.legend{display:flex; flex-wrap:wrap; gap:14px; padding:14px 16px; background:var(--wash);
        border:1px solid var(--line-soft); border-radius:var(--r); margin-bottom:22px}
.lItem{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-2)}
.lSw{width:16px; height:16px; border-radius:4px; flex:none}

      letter-spacing:.05em}

@media (max-width:860px){ .aside{border-left:0; padding-left:0; border-top:1px solid var(--line-soft); padding-top:24px} }

        color:var(--ink-3); margin:0 0 12px}
.scoreBig{display:flex; align-items:center; gap:14px; margin-bottom:6px}
.scoreBigN{width:52px; height:52px; border-radius:12px; display:grid; place-items:center;
           font-size:24px; font-weight:700; color:#fff}
.scoreBigL{font-size:15px; font-weight:650; line-height:1.25}

      border-bottom:1px solid var(--line-soft); font-size:13px}
.aRow span:first-child{color:var(--ink-3)}
.aList{margin:16px 0 0; padding:0; list-style:none; display:grid; gap:8px}
.aList button{width:100%; text-align:left; background:none; border:1px solid var(--line);
              border-radius:8px; padding:10px 12px; font-size:13px; color:var(--ink-2)}
.aList button:hover{border-color:var(--blue-light); color:var(--blue-deep)}

       font-size:13.5px; color:var(--ink-3); background:#fcfdfe; max-width:66ch}
.footer{border-top:1px solid var(--line); padding:28px 0 56px; font-size:12.5px;
        color:var(--ink-3); display:flex; justify-content:space-between; gap:20px;
        flex-wrap:wrap}
.banner{background:#fdf6e8; border-bottom:1px solid #f2e2bd; color:#7a5a10;
        font-size:12.5px; padding:9px 0}
.banner .wrap{display:flex; gap:8px}
.hidden{display:none !important}

</head>

  {key:"kwinana",        name:"Kwinana",        state:"WA",  x:21,   y:54},
  {key:"collie",         name:"Collie",         state:"WA",  x:23.5, y:59},
  {key:"darwin",         name:"Darwin",         state:"NT",  x:47,   y:18},
  {key:"mt-isa",         name:"Mt Isa",         state:"QLD", x:56,   y:33},
  {key:"townsville",     name:"Townsville",     state:"QLD", x:69,   y:30},
  {key:"gladstone",      name:"Gladstone",      state:"QLD", x:73,   y:40},
  {key:"hunter-valley",  name:"Hunter Valley",  state:"NSW", x:78,   y:54},
  {key:"port-kembla",    name:"Port Kembla",    state:"NSW", x:77.5, y:59},
  {key:"whyalla",        name:"Whyalla",        state:"SA",  x:52,   y:59},
  {key:"geelong",        name:"Geelong",        state:"VIC", x:60,   y:66},
  {key:"latrobe-valley", name:"Latrobe Valley", state:"VIC", x:69,   y:68},
  {key:"portland",       name:"Portland",       state:"VIC", x:57,   y:71},
  {key:"bell-bay",       name:"Bell Bay",       state:"TAS", x:66,   y:77}
/* status is derived from scores.js, never hand-maintained */
].map(r => ({...r, round: ROUND_DATE[r.key] || null,
              status: Object.keys(SCORES[r.key] || {}).length ? "published" : "none"}));

const BANDS = {
  1:{label:"Severe deficiency"},   2:{label:"Moderate deficiency"},
  3:{label:"Developing"},          4:{label:"Effective"},
  5:{label:"Leading practice"}
};

const STATUS_LABEL = { published:"Assessed", none:"Not yet assessed" };
function statusText(r){ return r.round ? `Assessed · ${r.round}` : "Not yet assessed"; }

const ALL_ITEMS = CSC.flatMap(p => p.groups.flatMap(g =>
  g.items.map(i => ({...i, pillarId:p.pillarId, pillarTitle:p.pillarTitle,
                     groupId:g.groupId, groupTitle:g.groupTitle}))));

function itemById(id){ return ALL_ITEMS.find(i => i.id === id); }
function scoreFor(region, id){ const s = SCORES[region]; return s ? s[id] : undefined; }
function coverage(region){
  const s = SCORES[region] || {};
  return { scored: Object.keys(s).length, total: ALL_ITEMS.length };
}
function pillarSummary(region, pillarId){
  const ids = ALL_ITEMS.filter(i => i.pillarId === pillarId).map(i => i.id);
  const vals = ids.map(id => scoreFor(region, id)).filter(v => v !== undefined);
  return { n: vals.length, total: ids.length,
           mean: vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null };
}


/* ---------------- tiny view router ---------------- */
let state = { view:"home", region:"hunter-valley", item:null, tab:"scale", open:{} };
const main = document.getElementById("main");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function go(view, opts){ state = {...state, view, ...(opts||{})}; render(); window.scrollTo(0,0); }
function openItem(id, region){ go("item", {item:id, region:region||state.region, tab:"scale"}); }

const regionName = k => (REGIONS.find(r=>r.key===k)||{}).name || k;
const swatch = v => v ? `var(--s${v})` : "var(--none)";

function scoreBox(v){
  return `<span class="sBox" data-v="${v||"-"}">${v || "–"}</span>`;
}
function legend(){
  return `<div class="legend">
    ${[1,2,3,4,5].map(v=>`<span class="lItem"><span class="lSw" style="background:${swatch(v)}"></span>${v} · ${BANDS[v].label}</span>`).join("")}
    <span class="lItem"><span class="lSw" style="background:var(--none)"></span>Not yet scored</span>
  </div>`;
}

/* ---------------- views ---------------- */
function viewHome(){
  const published = REGIONS.filter(r=>r.status==="published");
  const underway  = REGIONS.filter(r=>r.status==="underway");
  return `
  <div class="wrap">
    <div class="hero">
      <div class="eyebrow">Regional readiness assessment</div>
      <h1>How ready is each Australian industrial region to become a clean export powerhouse?</h1>
      <p class="lede">The National Action Plan assesses Australia's industrial regions against a
      common set of indicators, grouped into five themes. Each indicator is scored 1–5 against a
      published grading scale, with the evidence behind every score shown alongside it.</p>
      <div class="tiles">
        <div class="tile"><div class="tileN">${REGIONS.length}</div><div class="tileL">industrial regions in scope</div></div>
        <div class="tile"><div class="tileN">${ALL_ITEMS.length}</div><div class="tileL">indicators across 5 themes</div></div>
        <div class="tile"><div class="tileN">${published.length}</div><div class="tileL">regional assessments published</div></div>
        <div class="tile"><div class="tileN">${underway.length}</div><div class="tileL">assessments underway</div></div>
      </div>
    </div>

    <section>
      <div class="secHead">
        <h2>Regional assessments</h2>
        <div class="secNote">Scores shown are the indicators completed so far, not the full set.</div>
      </div>
      <div class="regions">${published.concat(underway).map(regionCard).join("")}</div>
    </section>

    <section style="padding-top:0">
      <div class="secHead"><h2>The five themes</h2>
        <div class="secNote">Open a theme to see its indicator groups.</div></div>
      <div>${CSC.map((p,i)=>pillarRow(p,i,null)).join("")}</div>
    </section>
  </div>`;
}

function regionCard(r){
  const cov = coverage(r.key);
  const themes = CSC.map(pl => pillarSummary(r.key, pl.pillarId));
  return `<button class="rCard" data-status="${r.status}" ${r.status==="none"?"disabled":""}
    onclick="go('region',{region:'${r.key}'})">
    <div class="rTop"><span class="rName">${esc(r.name)}</span><span class="rState">${r.state}</span></div>
    <div class="dots" title="Coverage by theme">${themes.map(t=>`<span class="dot"
      style="background:${t.n? "var(--s3)":"var(--none)"}; opacity:${t.n? (0.35 + 0.65*t.n/t.total).toFixed(2) : 1}"></span>`).join("")}</div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <span class="chip" data-s="${r.status}">${statusText(r)}</span>
      <span class="rMeta">${cov.scored}/${cov.total} scored</span>
    </div>
  </button>`;
}

function viewRegions(){
  return `<div class="wrap">
    <div class="crumbs"><button onclick="go('home')">Overview</button><span>/</span>Regions</div>
    <section>
      <div class="secHead"><h2>All regions</h2>
        <div class="secNote">Sixteen industrial regions are in scope. Assessments are published one round at a time.</div></div>
      ${legend()}
      <div class="regions">${REGIONS.map(regionCard).join("")}</div>
    </section>
  </div>`;
}

function viewRegion(){
  const r = REGIONS.find(x=>x.key===state.region);
  const cov = coverage(r.key);
  return `<div class="wrap">
    <div class="crumbs"><button onclick="go('home')">Overview</button><span>/</span>
      <button onclick="go('regions')">Regions</button><span>/</span>${esc(r.name)}</div>
    <div class="hero" style="padding:32px 0 32px">
      <div class="eyebrow">${r.state} · ${statusText(r)}</div>
      <h1 style="font-size:38px;margin-bottom:14px">${esc(r.name)}</h1>
      <p class="lede" style="font-size:16.5px">${cov.scored} of ${cov.total} indicators were
      scored in the ${r.round||"current"} round. Theme averages below are calculated only from scored indicators and
      will move as the round is completed.</p>
      <div class="tiles">
        ${CSC.map(p=>{
          const s = pillarSummary(r.key,p.pillarId);
          return `<div class="tile">
            <div class="tileN" style="${s.mean?"":"color:var(--ink-3)"}">${s.mean? s.mean.toFixed(1) : "–"}</div>
            <div class="tileL">${esc(p.pillarTitle)}<br><span style="color:var(--ink-3)">${s.n}/${s.total} scored</span></div>
          </div>`;
        }).join("")}
      </div>
    </div>
    <section>
      <div class="secHead"><h2>Indicator scores</h2>
        <div class="secNote">Click an indicator for the grading scale and the evidence behind its score.</div></div>
      ${legend()}
      <div>${CSC.map((p,i)=>pillarRow(p,i,r.key)).join("")}</div>
    </section>
  </div>`;
}

function pillarRow(p,i,region){
  const items = p.groups.flatMap(g=>g.items);
  const scored = region ? items.filter(it=>scoreFor(region,it.id)!==undefined).length : null;
  const open = state.open[p.pillarId];
  return `<div class="pillar">
    <button class="pBtn" aria-expanded="${!!open}" onclick="toggle('${p.pillarId}')">
      <span class="pIdx">${String(i+1).padStart(2,"0")}</span>
      <span class="pName">${esc(p.pillarTitle)}</span>
      <span class="pCount">${p.groups.length} groups · ${items.length} indicators${
        region ? ` · <strong style="color:var(--blue-deep)">${scored} scored</strong>` : ""}</span>
      <span class="pCar"></span>
    </button>
    <div class="pBody ${open?"open":""}">
      ${p.groups.map(g=>`<div class="grp">
        <div class="grpName">${esc(g.groupTitle)}</div>
        ${g.items.map(it=>{
          const v = region ? scoreFor(region,it.id) : undefined;
          return `<button class="iRow" onclick="openItem('${it.id}','${region||""}')">
            <span class="iName">${esc(it.title)}</span>
            <span class="iScore">
              ${region ? `<span class="sWord">${v?BANDS[v].label:"Not yet scored"}</span>${scoreBox(v)}`
                       : `<span class="sWord" style="width:auto">View indicator →</span>`}
            </span></button>`;
        }).join("")}
      </div>`).join("")}
    </div>
  </div>`;
}
function toggle(id){ state.open[id] = !state.open[id]; render(); }

function viewCriteria(){
  return `<div class="wrap">
    <div class="crumbs"><button onclick="go('home')">Overview</button><span>/</span>Criteria</div>
    <div class="hero" style="padding:32px 0 28px">
      <div class="eyebrow">Regional Assessment Process</div>
      <h1 style="font-size:36px">The assessment criteria</h1>
      <p class="lede" style="font-size:16.5px">Five themes, ${CSC.reduce((a,p)=>a+p.groups.length,0)} groups
      and ${ALL_ITEMS.length} indicators. Every region is assessed against the same set, so scores are
      comparable between regions and between rounds.</p>
    </div>
    <section><div>${CSC.map((p,i)=>pillarRow(p,i,null)).join("")}</div></section>
  </div>`;
}

function viewItem(){
  const it = itemById(state.item);
  const region = state.region;
  const v = scoreFor(region, it.id);
  const tab = state.tab;
  return `<div class="wrap">
    <div class="crumbs">
      <button onclick="go('home')">Overview</button><span>/</span>
      <button onclick="go('region',{region:'${region}'})">${esc(regionName(region))}</button><span>/</span>
      ${esc(it.pillarTitle)}<span>/</span>${esc(it.title)}
    </div>
    <div class="detail">
      <div>
        <div class="dKicker">${esc(it.pillarTitle)} · ${esc(it.groupTitle)}</div>
        <h3>${esc(it.title)}</h3>
        <div style="font-size:13.5px;color:var(--ink-3)">Assessed for ${esc(regionName(region))}</div>

        <div class="tabs" role="tablist">
          ${[["scale","Grading scale"],["evidence","Evidence"],["method","How it's assessed"],["history","Previous rounds"]]
            .map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" onclick="go('item',{tab:'${k}'})">${l}</button>`).join("")}
        </div>

        ${tab==="scale" ? `<div class="prose">
          <p>Each indicator is scored on the same five-point scale. The score for
          ${esc(regionName(region))} is marked below.</p>
          <div class="scaleList">
            ${[1,2,3,4,5].map(n=>`<div class="scaleRow" data-here="${v===n}">
              <span class="sBox" data-v="${n}">${n}</span>
              <span class="scaleName">${BANDS[n].label}</span>
              ${v===n?'<span class="here">THIS REGION</span>':""}
            </div>`).join("")}
          </div>
        </div>` : ""}

        ${tab==="evidence" ? (v ? `<div class="prose">
          <p><strong>Evidence text sits here.</strong> This is where the signed-off assessment
          paragraphs for this indicator would appear — the published wording, without hyperlinks,
          in the order the report sets out.</p>
          <p>Placing evidence directly under the score is the main structural change in this
          concept: the reader never has to choose between "learn more" and "see the assessment",
          because the score, the scale and the reasoning are on one page.</p>
        </div>` : `<div class="empty">This indicator has not been scored for
          ${esc(regionName(region))} yet, so there is no evidence text to show.</div>`) : ""}

        ${tab==="method" ? `<div class="prose">
          <p>The methodology content currently held in <code>learn-data.js</code> would render
          here: what the indicator measures, the data sources used, and the grading scale
          definitions in full.</p></div>` : ""}

        ${tab==="history" ? `<div class="empty">No previous rounds recorded for this indicator in
          ${esc(regionName(region))}. Once a second round exists, this tab shows the score for each
          round side by side with what changed.</div>` : ""}
      </div>

      <aside class="aside">
        <p class="aTitle">Score</p>
        ${v ? `<div class="scoreBig">
          <span class="scoreBigN" style="background:${swatch(v)};${v===1?"color:#0d2a4a":""}">${v}</span>
          <span class="scoreBigL">${BANDS[v].label}</span></div>`
           : `<div class="scoreBig"><span class="scoreBigN" style="background:var(--none);color:var(--ink-3);font-size:18px">–</span>
              <span class="scoreBigL" style="color:var(--ink-3);font-weight:550">Not yet scored</span></div>`}
        <div style="margin-top:20px">
          <div class="aRow"><span>Theme</span><span>${esc(it.pillarTitle)}</span></div>
          <div class="aRow"><span>Group</span><span>${esc(it.groupTitle)}</span></div>
          <div class="aRow"><span>Round</span><span>${(REGIONS.find(x=>x.key===region)||{}).round||"—"}</span></div>
        </div>
        <p class="aTitle" style="margin-top:26px">Same indicator elsewhere</p>
        <ul class="aList">
          ${REGIONS.filter(r=>r.status!=="none"&&r.key!==region).map(r=>{
            const rv = scoreFor(r.key,it.id);
            return `<li><button onclick="openItem('${it.id}','${r.key}')">
              ${esc(r.name)} — ${rv? `${rv} · ${BANDS[rv].label}` : "not yet scored"}</button></li>`;
          }).join("")}
        </ul>
      </aside>
    </div>
  </div>`;
}

function viewMethod(){
  return `<div class="wrap">
    <div class="crumbs"><button onclick="go('home')">Overview</button><span>/</span>Method</div>
    <div class="hero" style="padding:32px 0 28px">
      <div class="eyebrow">Regional Assessment Process</div>
      <h1 style="font-size:36px">How a region is assessed</h1>
      <p class="lede" style="font-size:16.5px">Four steps, run once per region per round. This page
      would carry the process content that currently lives across the assess-* pages.</p>
    </div>
    <section>
      ${[["Gather evidence","Public sources, regional plans and interviews are collected against each indicator."],
         ["Score against the scale","Each indicator is scored 1–5 using the published grading scale for that indicator."],
         ["Review","Scores and evidence are reviewed by contributors with regional knowledge."],
         ["Publish","The round is published with the evidence shown beside every score."]]
        .map(([t,d],i)=>`<div class="pillar"><div class="pBtn" style="cursor:default">
          <span class="pIdx">${String(i+1).padStart(2,"0")}</span>
          <span><span class="pName">${t}</span><div style="font-size:14px;color:var(--ink-2);margin-top:4px;max-width:60ch">${d}</div></span>
        </div></div>`).join("")}
    </section>
  </div>`;
}

function render(){
  const v = state.view;
  main.innerHTML = v==="home" ? viewHome()
    : v==="regions" ? viewRegions()
    : v==="region"  ? viewRegion()
    : v==="criteria"? viewCriteria()
    : v==="method"  ? viewMethod()
    : viewItem();
  document.querySelectorAll(".nav button").forEach(b=>{
    const map = {home:"home", regions:"regions", region:"regions", criteria:"criteria", item:"criteria", method:"method"};
    b.setAttribute("aria-current", map[v]===b.dataset.v ? "true":"false");
  });
}
state.open["enabling-infrastructure"] = true;
render();
</script>
</body>
</html>
