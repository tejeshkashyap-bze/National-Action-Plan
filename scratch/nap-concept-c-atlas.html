<!doctype html>
<!-- concept: Middle-ground, map-led direction. The map becomes the product rather than a
     dead-end image: selecting a region fills a persistent detail panel with theme progress,
     strongest and weakest scored indicators, and a comparison strip across regions.
     Warm neutral surfaces, BZE blue as the single accent, sequential blue score ramp. -->
<!-- replaces: index.html, map.html, city.html -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Concept C — Atlas · BZE National Action Plan</title>
<style>
:root{
  --paper:#f7f6f3; --card:#ffffff; --card-2:#fbfaf8;
  --line:#e3e0d9; --line-soft:#eeece7;
  --ink:#151a1d; --ink-2:#535c62; --ink-3:#8b9298;
  --blue:#127cbf; --blue-deep:#0d5a8c; --blue-soft:#e8f2f9;
  --s1:#86b6ef; --s2:#5598e7; --s3:#2a78d6; --s4:#1c5cab; --s5:#0d366b;
  --none:#e8e6e1;
  --amber:#b57e12; --amber-soft:#fdf5e4;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans); background:var(--paper); color:var(--ink); font-size:15px;
     line-height:1.55; -webkit-font-smoothing:antialiased}
button{font:inherit; cursor:pointer; color:inherit}

/* ---------- header ---------- */
.top{border-bottom:1px solid var(--line); background:rgba(247,246,243,.92);
     backdrop-filter:blur(8px); position:sticky; top:0; z-index:30}
.topIn{max-width:1320px; margin:0 auto; padding:0 26px; height:58px; display:flex;
       align-items:center; gap:26px}
.mk{display:flex; align-items:center; gap:9px; font-size:14px; font-weight:700;
    letter-spacing:-.01em; white-space:nowrap}
.mkDot{width:22px;height:22px;border-radius:6px;flex:none;
       background:linear-gradient(135deg,#3e9cd3,var(--blue))}
.mk small{font-weight:500; color:var(--ink-3)}
.topNav{margin-left:auto; display:flex; gap:4px}
.topNav button{border:0; background:none; padding:7px 12px; border-radius:8px; font-size:13.5px;
               color:var(--ink-2)}
.topNav button:hover{background:var(--card); color:var(--ink)}
.topNav button[aria-current="true"]{background:var(--card); color:var(--blue-deep);
  font-weight:650; box-shadow:0 1px 3px rgba(21,26,29,.06)}

.note{background:var(--amber-soft); border-bottom:1px solid #f0e3c4; color:#7d5a10;
      font-size:12.5px; padding:8px 0}
.note div{max-width:1320px; margin:0 auto; padding:0 26px}

/* ---------- shell ---------- */
.shell{max-width:1320px; margin:0 auto; padding:26px}
.split{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(320px,.95fr); gap:26px;
       align-items:start}
@media (max-width:1020px){ .split{grid-template-columns:1fr} }

/* ---------- map ---------- */
.mapCard{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
         overflow:hidden; box-shadow:0 1px 3px rgba(21,26,29,.05)}
.mapHead{padding:16px 20px 14px; border-bottom:1px solid var(--line-soft);
         display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.mapH{font-size:15px; font-weight:650; letter-spacing:-.01em}
.mapKey{margin-left:auto; display:flex; gap:14px; font-size:11.5px; color:var(--ink-3);
        flex-wrap:wrap}
.mapKey span{display:flex; align-items:center; gap:6px}
.kDot{width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid #fff;
      box-shadow:0 0 0 1px rgba(21,26,29,.16)}
.mapBody{position:relative; background:#eef6fb}
.mapBody img{display:block; width:100%; height:auto}
.pin{position:absolute; transform:translate(-6px,-50%); border:0; padding:0; background:none;
     display:flex; align-items:center; gap:6px; white-space:nowrap}
.pin[data-flip="1"]{transform:translate(calc(-100% + 6px),-50%); flex-direction:row-reverse}
.pinDot{width:11px;height:11px;border-radius:50%; border:2px solid #fff; flex:none;
        box-shadow:0 1px 4px rgba(21,26,29,.35); transition:transform .14s}
.pinLbl{font-size:11px; font-weight:600; color:var(--ink); background:rgba(255,255,255,.9);
        padding:2px 7px; border-radius:5px; box-shadow:0 1px 3px rgba(21,26,29,.12);
        transition:box-shadow .14s}
.pin:hover .pinDot{transform:scale(1.35)}
.pin:hover .pinLbl{box-shadow:0 3px 10px rgba(21,26,29,.22)}
.pin[aria-current="true"] .pinDot{transform:scale(1.5); box-shadow:0 0 0 4px rgba(18,124,191,.28)}
.pin[aria-current="true"] .pinLbl{background:var(--blue); color:#fff; font-weight:700}
.pin[data-s="none"] .pinLbl{color:var(--ink-3); background:rgba(255,255,255,.72); font-weight:500}
.mapFoot{padding:11px 20px; border-top:1px solid var(--line-soft); font-size:12px;
         color:var(--ink-3)}

/* ---------- panel ---------- */
.panel{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
       box-shadow:0 1px 3px rgba(21,26,29,.05); position:sticky; top:84px}
.pHead{padding:20px 22px 18px; border-bottom:1px solid var(--line-soft)}
.pKick{font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
       color:var(--blue); margin-bottom:9px}
.pName{font-size:26px; font-weight:700; letter-spacing:-.022em; margin:0 0 10px; line-height:1.12}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600;
      padding:3px 10px; border-radius:999px; border:1px solid transparent}
.chip[data-s="published"]{background:var(--blue-soft); color:var(--blue-deep); border-color:#cee5f4}
.chip[data-s="underway"]{background:var(--amber-soft); color:var(--amber); border-color:#f0e3c4}
.chip[data-s="none"]{background:#f2f1ee; color:var(--ink-3); border-color:var(--line)}
.pBody{padding:20px 22px 24px}
.lbl{font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
     color:var(--ink-3); margin:0 0 12px}
.lbl:not(:first-child){margin-top:26px}
.cov{display:flex; align-items:baseline; gap:9px; margin-bottom:10px}
.covN{font-size:32px; font-weight:700; letter-spacing:-.03em; line-height:1}
.covT{font-size:13px; color:var(--ink-3)}
.track{height:7px; border-radius:4px; background:var(--none); overflow:hidden}
.track i{display:block; height:100%; background:var(--blue); border-radius:4px}

/* theme rows */
.tRow{display:grid; grid-template-columns:1fr 84px 44px; gap:10px; align-items:center;
      padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:13px}
.tRow:last-child{border-bottom:0}
.tName{color:var(--ink-2); line-height:1.3}
.tBar{display:flex; gap:2px; height:8px}
.tSeg{flex:1; border-radius:2px; background:var(--none)}
.tVal{text-align:right; font-size:13px; font-weight:650; font-variant-numeric:tabular-nums}
.tVal[data-empty="true"]{color:var(--ink-3); font-weight:500}

/* indicator lists */
.iList{display:grid; gap:1px}
.iItem{display:flex; align-items:center; gap:10px; padding:8px 0;
       border-bottom:1px solid var(--line-soft); font-size:13px; text-align:left;
       background:none; border-left:0; border-right:0; border-top:0; width:100%}
.iItem:hover .iT{color:var(--blue-deep); text-decoration:underline; text-underline-offset:3px}
.iT{flex:1; color:var(--ink-2); line-height:1.3}
.sBox{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;flex:none;
      font-size:12.5px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.sBox[data-v="1"]{background:var(--s1);color:#0d2a4a}
.sBox[data-v="2"]{background:var(--s2)}
.sBox[data-v="3"]{background:var(--s3)}
.sBox[data-v="4"]{background:var(--s4)}
.sBox[data-v="5"]{background:var(--s5)}
.sBox[data-v="0"]{background:var(--none);color:var(--ink-3);font-weight:600}
.empty{border:1px dashed var(--line); border-radius:10px; padding:16px; font-size:13px;
       color:var(--ink-3); background:var(--card-2)}
.btn{display:block; width:100%; text-align:center; margin-top:20px; padding:11px;
     border-radius:9px; border:1px solid var(--blue); background:var(--blue); color:#fff;
     font-size:13.5px; font-weight:650}
.btn:hover{background:var(--blue-deep); border-color:var(--blue-deep)}
.btnG{background:none; color:var(--blue-deep); border-color:var(--line)}
.btnG:hover{background:var(--blue-soft); border-color:#cee5f4; color:var(--blue-deep)}

/* ---------- compare strip ---------- */
.strip{margin-top:26px; background:var(--card); border:1px solid var(--line);
       border-radius:var(--r); box-shadow:0 1px 3px rgba(21,26,29,.05); overflow:hidden}
.stripHead{padding:16px 20px 14px; border-bottom:1px solid var(--line-soft);
           display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.legend{margin-left:auto; display:flex; gap:12px; font-size:11.5px; color:var(--ink-3);
        flex-wrap:wrap; align-items:center}
.lSw{width:16px;height:16px;border-radius:4px}
.stripBody{overflow-x:auto}
table{border-collapse:separate; border-spacing:0; width:100%; min-width:620px}
th{padding:10px 12px; text-align:left; font-size:10.5px; font-weight:700; letter-spacing:.09em;
   text-transform:uppercase; color:var(--ink-3); border-bottom:1px solid var(--line-soft);
   white-space:nowrap}
th.n{text-align:center; width:96px}
td{padding:0; border-bottom:1px solid var(--line-soft); font-size:13px}
tr:last-child td{border-bottom:0}
.pillarTd{background:var(--card-2); padding:8px 12px; font-size:10.5px; font-weight:700;
          letter-spacing:.09em; text-transform:uppercase; color:var(--blue-deep)}
.nameTd button{width:100%; text-align:left; background:none; border:0; padding:9px 12px;
               font-size:13px; color:var(--ink)}
.nameTd button:hover{color:var(--blue-deep); text-decoration:underline; text-underline-offset:3px}
.cellTd{text-align:center; padding:4px 8px}
.cellTd .sBox{margin:0 auto; width:100%; max-width:60px; height:26px; border-radius:5px}

/* ---------- modal ---------- */
.scrim{position:fixed; inset:0; background:rgba(21,26,29,.42); z-index:60; display:none}
.scrim.on{display:block}
.modal{position:fixed; z-index:70; inset:auto 0 0 0; margin:0 auto; max-width:600px;
       background:var(--card); border-radius:14px 14px 0 0; box-shadow:0 -8px 40px rgba(21,26,29,.3);
       transform:translateY(100%); transition:transform .24s cubic-bezier(.4,0,.2,1);
       max-height:86vh; overflow-y:auto}
@media (min-width:700px){ .modal{inset:50% auto auto 50%; transform:translate(-50%,-46%) scale(.98);
  opacity:0; border-radius:14px; width:600px; max-height:82vh}
  .modal.on{transform:translate(-50%,-50%); opacity:1} }
.modal.on{transform:translateY(0)}
.mHead{padding:22px 24px 18px; border-bottom:1px solid var(--line-soft); position:relative}
.mClose{position:absolute; top:16px; right:16px; width:30px; height:30px; border-radius:8px;
        border:0; background:#f2f1ee; color:var(--ink-2); font-size:15px}
.mClose:hover{background:var(--none); color:var(--ink)}
.mBody{padding:20px 24px 30px}
.scaleRow{display:flex; align-items:center; gap:11px; padding:8px 10px; border-radius:8px;
          font-size:13px; color:var(--ink-2)}
.scaleRow[data-here="true"]{background:var(--blue-soft); color:var(--ink); font-weight:650}
.p{font-size:13.5px; color:var(--ink-2); margin:0 0 12px}
</style>
</head>

const BANDS = {
  1:{label:"Severe deficiency"},   2:{label:"Moderate deficiency"},
  3:{label:"Developing"},          4:{label:"Effective"},
  5:{label:"Leading practice"}
};

const STATUS_LABEL = { published:"Assessed", none:"Not yet assessed" };
function statusText(r){ return r.round ? `Assessed · ${r.round}` : "Not yet assessed"; }

const ALL_ITEMS = CSC.flatMap(p => p.groups.flatMap(g =>
  g.items.map(i => ({...i, pillarId:p.pillarId, pillarTitle:p.pillarTitle,
                     groupId:g.groupId, groupTitle:g.groupTitle}))));

function itemById(id){ return ALL_ITEMS.find(i => i.id === id); }
function scoreFor(region, id){ const s = SCORES[region]; return s ? s[id] : undefined; }
function coverage(region){
  const s = SCORES[region] || {};
  return { scored: Object.keys(s).length, total: ALL_ITEMS.length };
}
function pillarSummary(region, pillarId){
  const ids = ALL_ITEMS.filter(i => i.pillarId === pillarId).map(i => i.id);
  const vals = ids.map(id => scoreFor(region, id)).filter(v => v !== undefined);
  return { n: vals.length, total: ids.length,
           mean: vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null };
}

let state = { view:"atlas", region:"hunter-valley" };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ACTIVE = REGIONS.filter(r=>r.status!=="none");
const PIN_COLOUR = { published:"#127cbf", underway:"#d99b1f", none:"#b9b6ae" };
/* labels that sit to the west of their dot so they don't collide or run off the map */
const FLIP = new Set(["karratha","geraldton","kwinana","gladstone","hunter-valley","port-kembla","geelong"]);
const swatch = v => v ? `var(--s${v})` : "var(--none)";

function setView(v,opts){ state={...state,view:v,...(opts||{})}; render(); window.scrollTo(0,0); }
function selectRegion(k){ state.region=k; render(); }

/* ---------- map ---------- */
function mapCard(){
  return `<div class="mapCard">
    <div class="mapHead">
      <span class="mapH">Australia's industrial regions</span>
      <span class="mapKey">
        <span><i class="kDot" style="background:${PIN_COLOUR.published}"></i>Round 1 published</span>
        <span><i class="kDot" style="background:${PIN_COLOUR.underway}"></i>Assessment underway</span>
        <span><i class="kDot" style="background:${PIN_COLOUR.none}"></i>Not yet assessed</span>
      </span>
    </div>
    <div class="mapBody">
      <img src="${MAP_SRC}" alt="Map of Australia showing sixteen industrial regions" />
      ${REGIONS.map(r=>`<button class="pin" data-s="${r.status}" data-flip="${FLIP.has(r.key)?1:0}"
        aria-current="${state.region===r.key}" style="left:${r.x}%; top:${r.y}%"
        onclick="selectRegion('${r.key}')" ${r.status==="none"?"":""}>
        <span class="pinDot" style="background:${PIN_COLOUR[r.status]}"></span>
        <span class="pinLbl">${esc(r.name)}</span></button>`).join("")}
    </div>
    <div class="mapFoot">Select a region to see its assessment. ${REGIONS.length} regions in scope —
      ${REGIONS.filter(r=>r.status==="published").length} published,
      ${REGIONS.filter(r=>r.status==="underway").length} underway.</div>
  </div>`;
}

/* ---------- region panel ---------- */
function panel(){
  const r = REGIONS.find(x=>x.key===state.region);
  const cov = coverage(r.key);
  const scored = ALL_ITEMS.map(i=>({...i, v:scoreFor(r.key,i.id)})).filter(i=>i.v!==undefined);
  const strong = [...scored].sort((a,b)=>b.v-a.v).slice(0,4);
  const weak   = [...scored].sort((a,b)=>a.v-b.v).slice(0,4);

  return `<div class="panel">
    <div class="pHead">
      <div class="pKick">${r.state}</div>
      <h2 class="pName">${esc(r.name)}</h2>
      <span class="chip" data-s="${r.status}">${statusText(r)}</span>
    </div>
    <div class="pBody">
      ${cov.scored===0 ? `<div class="empty">No indicators have been scored for
        ${esc(r.name)} yet. When a round opens, progress and scores appear here.</div>
        <button class="btn btnG" onclick="setView('national')">See the national picture instead</button>`
      : `
      <p class="lbl">${esc(r.round||"Round")} assessment</p>
      <div class="cov"><span class="covN">${cov.scored}</span>
        <span class="covT">of ${cov.total} indicators scored</span></div>
      <div class="track"><i style="width:${cov.scored/cov.total*100}%"></i></div>

      <p class="lbl">By theme</p>
      ${CSC.map(p=>{
        const s = pillarSummary(r.key,p.pillarId);
        return `<div class="tRow">
          <span class="tName">${esc(p.pillarTitle)}</span>
          <span class="tBar">${Array.from({length:5},(_,k)=>
            `<i class="tSeg" style="background:${s.mean && k < Math.round(s.mean) ? "var(--s3)" : "var(--none)"}"></i>`).join("")}</span>
          <span class="tVal" data-empty="${!s.mean}">${s.mean? s.mean.toFixed(1) : "–"}</span>
        </div>`;
      }).join("")}
      <div style="font-size:11.5px;color:var(--ink-3);margin-top:9px">Averages use scored
        indicators only (${cov.scored} of ${cov.total}), so they will move as the round completes.</div>

      <p class="lbl">Strongest scored</p>
      <div class="iList">${strong.map(i=>`<button class="iItem" onclick="openItem('${i.id}','${r.key}')">
        <span class="iT">${esc(i.title)}</span>
        <span style="font-size:11.5px;color:var(--ink-3);width:118px;text-align:right">${BANDS[i.v].label}</span>
        <span class="sBox" data-v="${i.v}">${i.v}</span></button>`).join("")}</div>

      <p class="lbl">Weakest scored</p>
      <div class="iList">${weak.map(i=>`<button class="iItem" onclick="openItem('${i.id}','${r.key}')">
        <span class="iT">${esc(i.title)}</span>
        <span style="font-size:11.5px;color:var(--ink-3);width:118px;text-align:right">${BANDS[i.v].label}</span>
        <span class="sBox" data-v="${i.v}">${i.v}</span></button>`).join("")}</div>

      <button class="btn" onclick="setView('criteria')">See all ${cov.total} indicators</button>`}
    </div>
  </div>`;
}

/* ---------- compare strip ---------- */
function legendHTML(){
  return `<span class="legend">
    ${[1,2,3,4,5].map(v=>`<span><i class="lSw" style="background:${swatch(v)}"></i>${v} ${BANDS[v].label}</span>`).join("")}
    <span><i class="lSw" style="background:var(--none)"></i>Not scored</span></span>`;
}

function strip(){
  const cols = ACTIVE;
  const rows = CSC.map(p=>{
    const any = p.groups.flatMap(g=>g.items).some(i=>cols.some(c=>scoreFor(c.key,i.id)!==undefined));
    if(!any) return "";
    return `<tr><td class="pillarTd" colspan="${cols.length+1}">${esc(p.pillarTitle)}</td></tr>` +
      p.groups.flatMap(g=>g.items).filter(i=>cols.some(c=>scoreFor(c.key,i.id)!==undefined))
       .map(i=>`<tr>
         <td class="nameTd"><button onclick="openItem('${i.id}','${cols[0].key}')">${esc(i.title)}</button></td>
         ${cols.map(c=>{const v=scoreFor(c.key,i.id)||0;
           return `<td class="cellTd"><span class="sBox" data-v="${v}"
             title="${esc(c.name)} — ${v?BANDS[v].label:"not scored"}">${v||"·"}</span></td>`;}).join("")}
       </tr>`).join("");
  }).join("");
  const hidden = ALL_ITEMS.length - ALL_ITEMS.filter(i=>cols.some(c=>scoreFor(c.key,i.id)!==undefined)).length;
  return `<div class="strip">
    <div class="stripHead"><span class="mapH">Where regions differ</span>${legendHTML()}</div>
    <div class="stripBody"><table>
      <thead><tr><th>Indicator</th>${cols.map(c=>`<th class="n">${esc(c.name)}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="mapFoot">Showing the ${ALL_ITEMS.length-hidden} indicators scored in at least one
      region. ${hidden} indicators are not yet scored anywhere and are hidden from this comparison.</div>
  </div>`;
}

/* ---------- national view ---------- */
function viewNational(){
  const rows = ALL_ITEMS.map(i=>{
    const vals = ACTIVE.map(c=>scoreFor(c.key,i.id)).filter(v=>v!==undefined);
    return {...i, n:vals.length, mean: vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : null};
  });
  const scoredRows = rows.filter(r=>r.n>0).sort((a,b)=>a.mean-b.mean);
  return `
  <div class="strip" style="margin-top:0">
    <div class="stripHead"><span class="mapH">National picture — weakest indicators first</span>${legendHTML()}</div>
    <div class="stripBody"><table>
      <thead><tr><th>Indicator</th><th>Theme</th><th class="n">Regions</th><th class="n">Mean</th></tr></thead>
      <tbody>${scoredRows.map(r=>`<tr>
        <td class="nameTd"><button onclick="openItem('${r.id}','${ACTIVE[0].key}')">${esc(r.title)}</button></td>
        <td style="padding:9px 12px;font-size:12px;color:var(--ink-3)">${esc(r.pillarTitle)}</td>
        <td style="text-align:center;font-size:12.5px;color:var(--ink-3)">${r.n} of ${ACTIVE.length}</td>
        <td class="cellTd"><span class="sBox" data-v="${Math.round(r.mean)}">${r.mean.toFixed(1)}</span></td>
      </tr>`).join("")}</tbody></table></div>
    <div class="mapFoot">${rows.length-scoredRows.length} of ${rows.length} indicators are not yet
      scored in any region, so they cannot be ranked. Means are shown to one decimal place and
      coloured by their nearest band.</div>
  </div>`;
}

/* ---------- criteria view ---------- */
function viewCriteria(){
  const r = state.region;
  return `<div class="strip" style="margin-top:0">
    <div class="stripHead"><span class="mapH">All ${ALL_ITEMS.length} indicators —
      ${esc((REGIONS.find(x=>x.key===r)||{}).name)}</span>${legendHTML()}</div>
    <div class="stripBody"><table>
      <thead><tr><th>Indicator</th><th>Group</th><th class="n">Score</th><th style="width:170px">Band</th></tr></thead>
      <tbody>${CSC.map(p=>`<tr><td class="pillarTd" colspan="4">${esc(p.pillarTitle)}</td></tr>
        ${p.groups.flatMap(g=>g.items.map(i=>{const v=scoreFor(r,i.id)||0;
          return `<tr>
            <td class="nameTd"><button onclick="openItem('${i.id}','${r}')">${esc(i.title)}</button></td>
            <td style="padding:9px 12px;font-size:12px;color:var(--ink-3)">${esc(g.groupTitle)}</td>
            <td class="cellTd"><span class="sBox" data-v="${v}">${v||"·"}</span></td>
            <td style="padding:9px 12px;font-size:12.5px;color:${v?"var(--ink-2)":"var(--ink-3)"}">${v?BANDS[v].label:"Not yet scored"}</td>
          </tr>`;})).join("")}`).join("")}</tbody></table></div>
  </div>`;
}

/* ---------- modal ---------- */
function openItem(id, region){
  const it = itemById(id), v = scoreFor(region,id);
  const rn = (REGIONS.find(r=>r.key===region)||{}).name || region;
  $("modal").innerHTML = `
    <div class="mHead">
      <button class="mClose" onclick="closeModal()">✕</button>
      <div class="pKick">${esc(it.pillarTitle)} · ${esc(it.groupTitle)}</div>
      <h2 style="font-size:21px;font-weight:700;letter-spacing:-.018em;margin:0;line-height:1.25">${esc(it.title)}</h2>
      <div style="font-size:13px;color:var(--ink-3);margin-top:6px">${esc(rn)} · ${(REGIONS.find(x=>x.key===region)||{}).round||"no round"}</div>
    </div>
    <div class="mBody">
      <div style="display:flex;align-items:center;gap:13px;margin-bottom:20px">
        <span class="sBox" data-v="${v||0}" style="width:44px;height:44px;border-radius:10px;font-size:20px">${v||"·"}</span>
        <span style="font-size:16px;font-weight:650;line-height:1.2">${v?BANDS[v].label:"Not yet scored"}</span>
      </div>
      <p class="lbl" style="margin-top:0">Grading scale</p>
      ${[1,2,3,4,5].map(n=>`<div class="scaleRow" data-here="${v===n}">
        <span class="sBox" data-v="${n}">${n}</span>${BANDS[n].label}
        ${v===n?'<span style="margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.07em;color:var(--blue-deep)">THIS REGION</span>':""}</div>`).join("")}
      <p class="lbl">Evidence</p>
      ${v ? `<p class="p">The signed-off evidence paragraphs for this indicator would render here —
        published wording, in report order, without hyperlinks.</p>`
          : `<div class="empty">Not scored for ${esc(rn)} yet, so there is no evidence to show.</div>`}
      <p class="lbl">Same indicator, other regions</p>
      <div class="iList">${ACTIVE.filter(r=>r.key!==region).map(r=>{const rv=scoreFor(r.key,id);
        return `<button class="iItem" onclick="openItem('${id}','${r.key}')">
          <span class="iT">${esc(r.name)}</span>
          <span style="font-size:11.5px;color:var(--ink-3);width:118px;text-align:right">${rv?BANDS[rv].label:"not scored"}</span>
          <span class="sBox" data-v="${rv||0}">${rv||"·"}</span></button>`;}).join("")}</div>
    </div>`;
  $("modal").classList.add("on"); $("modal").setAttribute("aria-hidden","false");
  $("scrim").classList.add("on");
}
function closeModal(){ $("modal").classList.remove("on");
  $("modal").setAttribute("aria-hidden","true"); $("scrim").classList.remove("on"); }
document.addEventListener("keydown", e => { if(e.key==="Escape") closeModal(); });

/* ---------- render ---------- */
function render(){
  const v = state.view;
  $("shell").innerHTML = v==="atlas"
    ? `<div class="split">${mapCard()}${panel()}</div>${strip()}`
    : v==="national" ? viewNational() : viewCriteria();
  document.querySelectorAll(".topNav button").forEach(b=>
    b.setAttribute("aria-current", b.dataset.v===v));
}
render();
</script>
</body>
</html>
